version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-acr_control_plane}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acr} -d ${POSTGRES_DB:-acr_control_plane}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Export the core and operator policies from the same release as the gateway.
  acr-policy-export:
    image: ${ACR_GATEWAY_IMAGE:-acr-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    command: ["python", "-m", "acr.policy_studio.core_bundle", "export", "--output", "/managed", "--extensions", "/operator-policies", "--gateway-url", "http://acr-gateway:8000", "--replace"]
    volumes:
      - managed_policy:/managed
      - ./operator-policies:/operator-policies:ro
    restart: "no"

  # ── Open Policy Agent ──────────────────────────────────
  opa:
    image: openpolicyagent/opa:0.70.0
    environment:
      ACR_BUNDLE_API_KEY: ${SERVICE_OPERATOR_API_KEY:?Set an existing auditor-authorized service operator key}
    ports:
      - "8181:8181"
    volumes:
      - managed_policy:/managed:ro
    depends_on:
      acr-policy-export:
        condition: service_completed_successfully
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-format=json"
      - "--config-file=/managed/opa-config.yaml"
    healthcheck:
      # The official OPA image contains /opa, not wget or a shell.
      test:
        - CMD
        - /opa
        - eval
        - --fail
        - 'http.send({"method": "GET", "url": "http://127.0.0.1:8181/health?bundles", "timeout": "2s"}).status_code == 200'
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ── ACR Kill Switch (independent service) ─────────────
  acr-killswitch:
    build:
      context: .
      dockerfile: Dockerfile.killswitch
    ports:
      - "8443:8443"
    environment:
      REDIS_URL: redis://redis:6379/0
      KILLSWITCH_SECRET: ${KILLSWITCH_SECRET:-killswitch_dev_secret_change_me}
      OPERATOR_API_KEYS_JSON: ${OPERATOR_API_KEYS_JSON:?Set operator keys including the bundle service key}
      ACR_ENV: ${ACR_ENV:-development}
      WEB_CONCURRENCY: ${KILLSWITCH_WORKERS:-2}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── ACR Migrations (one-shot) ──────────────────────────
  # Runs `alembic upgrade head` against the database, then exits cleanly.
  # The gateway service waits for this to finish (service_completed_successfully)
  # before starting, so the schema is always up-to-date and migrations cannot
  # be forgotten when running the stack locally or in CI.
  acr-migrate:
    image: ${ACR_GATEWAY_IMAGE:-acr-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["run-migrations"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acr}:${POSTGRES_PASSWORD:-acr_dev_password}@postgres:5432/${POSTGRES_DB:-acr_control_plane}
      ACR_ENV: ${ACR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── ACR Gateway (main service) ─────────────────────────
  acr-gateway:
    volumes:
      - ./operator-policies:/operator-policies:ro
    image: ${ACR_GATEWAY_IMAGE:-acr-gateway:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-acr}:${POSTGRES_PASSWORD:-acr_dev_password}@postgres:5432/${POSTGRES_DB:-acr_control_plane}
      REDIS_URL: redis://redis:6379/0
      POLICY_BUNDLE_LOCAL_DIR: /tmp/policy-bundles
      POLICY_EXTENSION_DIR: /operator-policies
      OPA_URL: http://opa:8181
      KILLSWITCH_URL: http://acr-killswitch:8443
      KILLSWITCH_SECRET: ${KILLSWITCH_SECRET:-killswitch_dev_secret_change_me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_jwt_secret_change_in_production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_TOKEN_EXPIRE_MINUTES: ${JWT_TOKEN_EXPIRE_MINUTES:-30}
      ACR_ENV: ${ACR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEMA_BOOTSTRAP_MODE: ${SCHEMA_BOOTSTRAP_MODE:-auto}
      STRICT_DEPENDENCY_STARTUP: ${STRICT_DEPENDENCY_STARTUP:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OPERATOR_API_KEYS_JSON: ${OPERATOR_API_KEYS_JSON:?Set operator keys including the bundle service key}
      SERVICE_OPERATOR_API_KEY: ${SERVICE_OPERATOR_API_KEY:?Set an existing auditor-authorized service operator key}
      EXECUTE_ALLOWED_ACTIONS: ${EXECUTE_ALLOWED_ACTIONS:-false}
      TOOL_EXECUTOR_MAP_JSON: ${TOOL_EXECUTOR_MAP_JSON:-}
      EXECUTOR_HMAC_SECRET: ${EXECUTOR_HMAC_SECRET:-}
      EXECUTOR_CREDENTIAL_SECRET: ${EXECUTOR_CREDENTIAL_SECRET:-}
      EXECUTOR_TIMEOUT_SECONDS: ${EXECUTOR_TIMEOUT_SECONDS:-8.0}
      # ── Integrations (v1.5.0 WS4): all OFF by default ──
      INTEGRATIONS_OUTBOX_POLL_SECONDS: ${INTEGRATIONS_OUTBOX_POLL_SECONDS:-5}
      INTEGRATIONS_OUTBOX_MAX_ATTEMPTS: ${INTEGRATIONS_OUTBOX_MAX_ATTEMPTS:-5}
      INTEGRATIONS_OUTBOX_BACKOFF_BASE_SECONDS: ${INTEGRATIONS_OUTBOX_BACKOFF_BASE_SECONDS:-30}
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_APPROVALS_CHANNEL: ${SLACK_APPROVALS_CHANNEL:-}
      SLACK_ALERTS_CHANNEL: ${SLACK_ALERTS_CHANNEL:-}
      SLACK_APPROVER_MAP_JSON: ${SLACK_APPROVER_MAP_JSON:-}
      TEAMS_ENABLED: ${TEAMS_ENABLED:-false}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TEAMS_CALLBACK_SECRET: ${TEAMS_CALLBACK_SECRET:-}
      TEAMS_CALLBACK_BASE_URL: ${TEAMS_CALLBACK_BASE_URL:-}
      TEAMS_APPROVER_MAP_JSON: ${TEAMS_APPROVER_MAP_JSON:-}
      SERVICENOW_ENABLED: ${SERVICENOW_ENABLED:-false}
      SERVICENOW_INSTANCE_URL: ${SERVICENOW_INSTANCE_URL:-}
      SERVICENOW_USERNAME: ${SERVICENOW_USERNAME:-}
      SERVICENOW_PASSWORD: ${SERVICENOW_PASSWORD:-}
      SERVICENOW_INCIDENT_ON_DENY: ${SERVICENOW_INCIDENT_ON_DENY:-false}
      SENTINEL_ENABLED: ${SENTINEL_ENABLED:-false}
      SENTINEL_DCE_ENDPOINT: ${SENTINEL_DCE_ENDPOINT:-}
      SENTINEL_DCR_IMMUTABLE_ID: ${SENTINEL_DCR_IMMUTABLE_ID:-}
      SENTINEL_STREAM_NAME: ${SENTINEL_STREAM_NAME:-Custom-ACRDecisions_CL}
      SENTINEL_TENANT_ID: ${SENTINEL_TENANT_ID:-}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
      SENTINEL_BATCH_MAX: ${SENTINEL_BATCH_MAX:-100}
      SPLUNK_HEC_ENABLED: ${SPLUNK_HEC_ENABLED:-false}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN:-}
      SPLUNK_HEC_INDEX: ${SPLUNK_HEC_INDEX:-}
      SPLUNK_HEC_SOURCE: ${SPLUNK_HEC_SOURCE:-acr-control-plane}
      SPLUNK_HEC_SOURCETYPE: ${SPLUNK_HEC_SOURCETYPE:-acr:events}
      SPLUNK_HEC_BATCH_MAX: ${SPLUNK_HEC_BATCH_MAX:-100}
      SYSLOG_ENABLED: ${SYSLOG_ENABLED:-false}
      SYSLOG_HOST: ${SYSLOG_HOST:-}
      SYSLOG_PORT: ${SYSLOG_PORT:-514}
      SYSLOG_PROTOCOL: ${SYSLOG_PROTOCOL:-udp}
      SYSLOG_FACILITY: ${SYSLOG_FACILITY:-16}
      SYSLOG_APP_NAME: ${SYSLOG_APP_NAME:-acr}
      WEB_CONCURRENCY: ${GATEWAY_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_started
      acr-killswitch:
        condition: service_healthy
      acr-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/acr/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── ACR MCP Gateway (v1.5.0 WS5, opt-in profile) ──
  # Policy-enforcing proxy in front of ONE upstream MCP server. It is
  # profile-gated because the upstream is deployment-specific: enable
  # with `docker compose --profile mcp-gateway up` and
  # MCP_GATEWAY_UPSTREAM_URL set. The upstream must be reachable ONLY
  # through this service — see docs/mcp-gateway.md.
  acr-mcp-gateway:
    profiles: ["mcp-gateway"]
    build:
      context: .
      dockerfile: Dockerfile.mcp-gateway
    ports:
      - "8080:8080"
    environment:
      MCP_GATEWAY_UPSTREAM_URL: ${MCP_GATEWAY_UPSTREAM_URL:-}
      MCP_GATEWAY_UPSTREAM_ID: ${MCP_GATEWAY_UPSTREAM_ID:-}
      MCP_GATEWAY_AGENT_ID: ${MCP_GATEWAY_AGENT_ID:-acr-mcp-gateway}
      ACR_GATEWAY_URL: http://acr-gateway:8000
      MCP_GATEWAY_OPERATOR_API_KEY: ${SERVICE_OPERATOR_API_KEY}
      MCP_GATEWAY_MAX_RESPONSE_BYTES: ${MCP_GATEWAY_MAX_RESPONSE_BYTES:-1048576}
      MCP_GATEWAY_TOOL_PINNING: ${MCP_GATEWAY_TOOL_PINNING:-enforce}
      ACR_ENV: ${ACR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_CONCURRENCY: ${MCP_GATEWAY_WORKERS:-2}
    depends_on:
      acr-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  managed_policy:
  postgres_data:
  redis_data:
