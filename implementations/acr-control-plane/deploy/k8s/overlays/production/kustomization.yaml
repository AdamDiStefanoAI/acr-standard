apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- external-secret.yaml
- networkpolicy-production.yaml
patches:
- path: namespace-patch.yaml
- path: gateway-configmap-patch.yaml
- path: gateway-deployment-patch.yaml
- path: killswitch-deployment-patch.yaml
- path: ingress-patch.yaml
- path: remove-base-gateway-netpol.yaml
- path: remove-base-killswitch-netpol.yaml
images:
- name: acr-gateway
  newName: ghcr.io/adamdistefanoai/acr-standard/acr-gateway
  newTag: 1.3.0
- name: acr-killswitch
  newName: ghcr.io/adamdistefanoai/acr-standard/acr-killswitch
  newTag: 1.3.0
- name: openpolicyagent/opa
  newName: openpolicyagent/opa
  newTag: 0.70.0
