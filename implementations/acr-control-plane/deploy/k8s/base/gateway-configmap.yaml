apiVersion: v1
kind: ConfigMap
metadata:
  name: acr-gateway-config
data:
  ACR_ENV: "production"
  LOG_LEVEL: "INFO"
  SCHEMA_BOOTSTRAP_MODE: "validate"
  STRICT_DEPENDENCY_STARTUP: "true"
  POLICY_EXTENSION_DIR: "/operator-policies"
  OPA_URL: "http://127.0.0.1:8181"
  KILLSWITCH_URL: "http://acr-killswitch:8443"
  OTEL_SERVICE_NAME: "acr-control-plane"
  EXECUTE_ALLOWED_ACTIONS: "true"
  REQUIRE_BUNDLE_AUTH: "true"
  POLICY_BUNDLE_BACKEND: "s3"
  POLICY_BUNDLE_S3_BUCKET: "change-me"
  POLICY_BUNDLE_S3_PREFIX: "acr/policy-bundles"
  POLICY_BUNDLE_S3_REGION: "us-east-1"
  POLICY_BUNDLE_PUBLIC_BASE_URL: "https://acr.example.com"
  OIDC_ENABLED: "true"
  OIDC_ISSUER: "https://login.example.com/"
  OIDC_CLIENT_ID: "acr-control-plane"
  OIDC_AUTHORIZE_URL: "https://login.example.com/oauth2/v1/authorize"
  OIDC_TOKEN_URL: "https://login.example.com/oauth2/v1/token"
  OIDC_JWKS_URL: "https://login.example.com/oauth2/v1/keys"
  OIDC_REDIRECT_URI: "https://acr.example.com/acr/auth/oidc/callback"
  OIDC_SCOPES: "openid profile email groups"
  OIDC_ROLES_CLAIM: "groups"
  OIDC_SUBJECT_CLAIM: "email"
  OIDC_ROLE_MAPPING_JSON: >
    {"acr-platform-admin":["agent_admin","security_admin","auditor","killswitch_operator","approver"],
     "acr-approver":["approver"],
     "acr-auditor":["auditor"]}
  EXECUTOR_INTEGRATIONS_JSON: >
    {"issue_refund":{"provider":"refund_api","url":"https://refunds.internal/api/refunds","api_key":"env:FINANCE_EXECUTOR_API_KEY","default_currency":"USD"},
     "send_email":{"provider":"email_api","url":"https://messaging.internal/api/send","api_key":"env:EMAIL_EXECUTOR_API_KEY","from_address":"ops@example.com"},
     "create_ticket":{"provider":"ticket_api","url":"https://tickets.internal/api/tickets","api_key":"env:TICKET_EXECUTOR_API_KEY","default_queue":"operations"}}
  # ── Integrations (v1.5.0 WS4): all OFF by default ──
  # Enable one integration at a time and fill in its settings; the
  # secret-valued keys (bot tokens, signing secrets, passwords) live in
  # the gateway Secret — see gateway-secret.example.yaml.
  INTEGRATIONS_OUTBOX_POLL_SECONDS: "5"
  INTEGRATIONS_OUTBOX_MAX_ATTEMPTS: "5"
  INTEGRATIONS_OUTBOX_BACKOFF_BASE_SECONDS: "30"
  SLACK_ENABLED: "false"
  SLACK_APPROVALS_CHANNEL: ""
  SLACK_ALERTS_CHANNEL: ""
  SLACK_APPROVER_MAP_JSON: ""
  TEAMS_ENABLED: "false"
  TEAMS_WEBHOOK_URL: ""
  TEAMS_CALLBACK_BASE_URL: ""
  TEAMS_APPROVER_MAP_JSON: ""
  SERVICENOW_ENABLED: "false"
  SERVICENOW_INSTANCE_URL: ""
  SERVICENOW_USERNAME: ""
  SERVICENOW_INCIDENT_ON_DENY: "false"
  SENTINEL_ENABLED: "false"
  SENTINEL_DCE_ENDPOINT: ""
  SENTINEL_DCR_IMMUTABLE_ID: ""
  SENTINEL_STREAM_NAME: "Custom-ACRDecisions_CL"
  SENTINEL_TENANT_ID: ""
  SENTINEL_CLIENT_ID: ""
  SENTINEL_BATCH_MAX: "100"
  SPLUNK_HEC_ENABLED: "false"
  SPLUNK_HEC_URL: ""
  SPLUNK_HEC_INDEX: ""
  SPLUNK_HEC_SOURCE: "acr-control-plane"
  SPLUNK_HEC_SOURCETYPE: "acr:events"
  SPLUNK_HEC_BATCH_MAX: "100"
  SYSLOG_ENABLED: "false"
  SYSLOG_HOST: ""
  SYSLOG_PORT: "514"
  SYSLOG_PROTOCOL: "udp"
  SYSLOG_FACILITY: "16"
  SYSLOG_APP_NAME: "acr"
