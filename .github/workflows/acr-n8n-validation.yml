name: ACR n8n webhook validation
on:
  pull_request:
    branches: [main, example/runnable-langgraph-guard]
    paths:
      - 'implementations/acr-control-plane/**'
      - '.github/workflows/acr-n8n-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acr-n8n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  n8n-webhook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: implementations/acr-control-plane
    env:
      COMPOSE_PROJECT_NAME: acr-n8n-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.full-stack-test.yml:examples/n8n/compose.yaml:examples/n8n/compose.ci.yaml
      N8N_IMAGE: n8nio/n8n:2.47.5
      # Public synthetic CI credentials, valid only for this disposable stack.
      OPERATOR_API_KEYS_JSON: '{"ci-operator-only":{"subject":"ci-operator","roles":["agent_admin","approver","security_admin","auditor","killswitch_operator"]}}'
      SERVICE_OPERATOR_API_KEY: ci-operator-only
      EXECUTOR_HMAC_SECRET: ci-execution-only-not-a-production-secret-123456789
      EXECUTOR_CREDENTIAL_SECRET: ci-brokered-only-not-a-production-secret-987654321
      JWT_SECRET_KEY: ci-jwt-only-not-a-production-secret-123456789012345
      KILLSWITCH_SECRET: ci-kill-only-not-a-production-secret-12345678901234
      ACR_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record revision and runtime
        run: |
          mkdir -p n8n-evidence
          git rev-parse HEAD > n8n-evidence/revision.txt
          docker version > n8n-evidence/docker-version.txt
          printf "%s\n" "$N8N_IMAGE" > n8n-evidence/n8n-image.txt
          docker compose version >> n8n-evidence/docker-version.txt
          mkdir -p examples/n8n/.ci-input
          docker compose config --quiet
      - name: Pull disposable images
        timeout-minutes: 5
        run: docker compose pull postgres redis opa n8n
      - name: Build and start the complete stack
        timeout-minutes: 12
        run: docker compose up --build -d --wait --wait-timeout 300 postgres redis acr-policy-export opa acr-gateway acr-killswitch protected-executor n8n-demo-executor
      - name: Import real n8n workflow and exercise authenticated webhook
        timeout-minutes: 8
        run: python3 examples/n8n/validate_live.py
      - name: Capture synthetic test-service logs
        if: always()
        run: |
          mkdir -p n8n-evidence
          docker compose ps -a > n8n-evidence/compose-status.txt
          for container in $(docker compose ps -aq); do
            docker inspect --format '{{.Name}} {{json .State.Health}}' "$container"
          done > n8n-evidence/container-health.txt
          docker compose logs --no-color --tail 300 > n8n-evidence/compose.log
      - name: Tear down only this run's disposable stack
        if: always()
        timeout-minutes: 3
        run: |
          docker compose down -v --remove-orphans
          rm -rf examples/n8n/.ci-input
      - name: Retain bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acr-n8n-${{ github.run_id }}-${{ github.run_attempt }}
          path: implementations/acr-control-plane/n8n-evidence/
          retention-days: 1
