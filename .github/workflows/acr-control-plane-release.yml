name: ACR Control Plane Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/acr-control-plane-release.yml"
      - "LICENSE"
      - "implementations/acr-control-plane/LICENSE"
      - "implementations/acr-control-plane/Dockerfile*"
      - "implementations/acr-control-plane/pyproject.toml"
      - "implementations/acr-control-plane/scripts/*release_licenses.py"
  workflow_dispatch: # Validation only; dispatch never publishes.

permissions:
  contents: read

env:
  CONTROL_PLANE_DIR: implementations/acr-control-plane
  COMPLIANCE_OUTPUT_DIR: dist/compliance
  PACKAGE_BASENAME: acr-control-plane-compliance-package-${{ github.ref_name }}

jobs:
  build-images:
    name: Validate ${{ matrix.service }} release image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: Dockerfile
          - service: killswitch
            dockerfile: Dockerfile.killswitch

    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "uri=ghcr.io/${repo_lc}/acr-${{ matrix.service }}" >> "${GITHUB_OUTPUT}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.uri }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set package version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0+validation" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.service }} release candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTROL_PLANE_DIR }}
          file: ${{ env.CONTROL_PLANE_DIR }}/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: acr-${{ matrix.service }}:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.version.outputs.version }}

      - name: Check actual image and installed package license bytes
        run: python "${CONTROL_PLANE_DIR}/scripts/check_release_licenses.py" --image acr-${{ matrix.service }}:release-candidate

      - name: Save and reload validated image without rebuilding
        run: |
          docker save acr-${{ matrix.service }}:release-candidate -o "${RUNNER_TEMP}/image.tar"
          docker image rm acr-${{ matrix.service }}:release-candidate
          docker load --input "${RUNNER_TEMP}/image.tar"
          python "${CONTROL_PLANE_DIR}/scripts/check_release_licenses.py" --image acr-${{ matrix.service }}:release-candidate

      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 3
          compression-level: 0

  build-python:
    name: Validate Python release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test license gate and build distributions
        working-directory: ${{ env.CONTROL_PLANE_DIR }}
        run: |
          python scripts/test_release_licenses.py
          python -m pip install --upgrade build
          python -m build --outdir dist
          python scripts/check_release_licenses.py --dist-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-distributions
          path: ${{ env.CONTROL_PLANE_DIR }}/dist/*
          retention-days: 3

  docker-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish ${{ matrix.service }} image
    needs: [build-images, build-python]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: Dockerfile
          - service: killswitch
            dockerfile: Dockerfile.killswitch

    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "uri=ghcr.io/${repo_lc}/acr-${{ matrix.service }}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.uri }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - uses: actions/download-artifact@v4
        with:
          name: release-image-${{ matrix.service }}
          path: ${{ runner.temp }}/release-image

      - name: Load and recheck validated image
        run: |
          docker load --input "${RUNNER_TEMP}/release-image/image.tar"
          python "${CONTROL_PLANE_DIR}/scripts/check_release_licenses.py" --image acr-${{ matrix.service }}:release-candidate

      - name: Push the validated image without rebuilding
        id: build
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker tag acr-${{ matrix.service }}:release-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          digest_ref=$(docker image inspect acr-${{ matrix.service }}:release-candidate --format '{{index .RepoDigests 0}}')
          digest="${digest_ref##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.uri }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image with GitHub OIDC
        run: cosign sign --yes "${IMAGE_URI}@${DIGEST}"
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          DIGEST: ${{ steps.build.outputs.digest }}

  compliance-package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Build signed compliance package
    needs: [build-images, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Build compliance package
        run: |
          python scripts/build_compliance_package.py \
            --implementation-dir . \
            --version "${GITHUB_REF_NAME}" \
            --source-ref "${GITHUB_SHA}" \
            --output-dir "../../${COMPLIANCE_OUTPUT_DIR}"
        working-directory: ${{ env.CONTROL_PLANE_DIR }}

      - name: Sign compliance package tarball
        run: |
          cosign sign-blob --yes \
            --bundle "${COMPLIANCE_OUTPUT_DIR}/${PACKAGE_BASENAME}.sigstore.json" \
            "${COMPLIANCE_OUTPUT_DIR}/${PACKAGE_BASENAME}.tar.gz"

      - name: Attest compliance package provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.COMPLIANCE_OUTPUT_DIR }}/${{ env.PACKAGE_BASENAME }}.tar.gz

      - name: Upload compliance release assets
        uses: actions/upload-artifact@v4
        with:
          name: acr-control-plane-compliance-assets
          path: |
            ${{ env.COMPLIANCE_OUTPUT_DIR }}/${{ env.PACKAGE_BASENAME }}.tar.gz
            ${{ env.COMPLIANCE_OUTPUT_DIR }}/${{ env.PACKAGE_BASENAME }}.manifest.json
            ${{ env.COMPLIANCE_OUTPUT_DIR }}/${{ env.PACKAGE_BASENAME }}.sha256
            ${{ env.COMPLIANCE_OUTPUT_DIR }}/${{ env.PACKAGE_BASENAME }}.sigstore.json
          retention-days: 30

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker-publish, compliance-package, pypi-publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download compliance assets
        uses: actions/download-artifact@v4
        with:
          name: acr-control-plane-compliance-assets
          path: dist/release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            dist/release-assets/${{ env.PACKAGE_BASENAME }}.tar.gz
            dist/release-assets/${{ env.PACKAGE_BASENAME }}.manifest.json
            dist/release-assets/${{ env.PACKAGE_BASENAME }}.sha256
            dist/release-assets/${{ env.PACKAGE_BASENAME }}.sigstore.json

  pypi-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish to PyPI
    needs: [build-images, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no API tokens
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-python-distributions
          path: ${{ env.CONTROL_PLANE_DIR }}/dist
      - name: Recheck exact distributions before publishing
        run: python "${CONTROL_PLANE_DIR}/scripts/check_release_licenses.py" --dist-dir "${CONTROL_PLANE_DIR}/dist"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.CONTROL_PLANE_DIR }}/dist
