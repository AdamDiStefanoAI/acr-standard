name: ACR Control Plane CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "implementations/acr-control-plane/**"
      - ".github/workflows/acr-control-plane-ci.yml"
      - ".github/workflows/acr-control-plane-security.yml"
      - ".github/workflows/acr-control-plane-release.yml"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths:
      - "implementations/acr-control-plane/**"
      - ".github/workflows/acr-control-plane-ci.yml"
      - ".github/workflows/acr-control-plane-security.yml"
      - ".github/workflows/acr-control-plane-release.yml"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This is a monorepo. Defaults apply to shell steps, not action inputs.
defaults:
  run:
    working-directory: implementations/acr-control-plane

jobs:
  release-licenses:
    name: Release license gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test missing, altered and duplicate license rejection
        run: python scripts/test_release_licenses.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs reads the root repository's tags.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/acr-control-plane/pyproject.toml

      - name: Install dev dependencies
        id: dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Ruff lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ruff check src/ tests/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: implementations/acr-control-plane/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install pinned OPA policy compiler
        run: |
          set -eu
          container=$(docker create openpolicyagent/opa:0.70.0)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opa" "$RUNNER_TEMP/opa"
          chmod +x "$RUNNER_TEMP/opa"
          echo "OPA_BINARY=$RUNNER_TEMP/opa" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run tests with coverage
        env:
          # Disposable test values, never production credentials.
          JWT_SECRET_KEY: "ci_test_secret_not_for_production_at_all"
          KILLSWITCH_SECRET: "ci_killswitch_secret_not_for_production"
          ACR_ENV: "test"
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/integration \
            --cov=src/acr \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80 \
            --junitxml=test-results.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acr-test-reports-python-${{ matrix.python-version }}
          path: |
            implementations/acr-control-plane/coverage.xml
            implementations/acr-control-plane/test-results.xml
          retention-days: 7

  # Run independently so an existing unit-test/coverage failure does not hide
  # integration failures. Only local, disposable infrastructure is started.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.integration.yml
      OPERATOR_API_KEYS_JSON: '{"ci-operator-only":{"subject":"ci-operator","roles":["auditor"]}}'
      SERVICE_OPERATOR_API_KEY: ci-operator-only
      RUN_INTEGRATION_TESTS: "true"
      TEST_DATABASE_URL: postgresql+asyncpg://acr:acr_dev_password@localhost:5432/acr_control_plane
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_OPA_URL: http://localhost:8181
      POLICY_EXTENSION_DIR: operator-policies
      # Root conftest imports settings before the integration conftest runs.
      DATABASE_URL: postgresql+asyncpg://acr:acr_dev_password@localhost:5432/acr_control_plane
      REDIS_URL: redis://localhost:6379/1
      OPA_URL: http://localhost:8181
      JWT_SECRET_KEY: "integration_test_secret_not_for_production_at_all"
      KILLSWITCH_SECRET: "integration_killswitch_secret_not_for_production"
      ACR_ENV: "test"
      SCHEMA_BOOTSTRAP_MODE: "create"
      STRICT_DEPENDENCY_STARTUP: "false"
      EXECUTE_ALLOWED_ACTIONS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: implementations/acr-control-plane/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install pinned OPA policy compiler
        run: |
          set -eu
          container=$(docker create openpolicyagent/opa:0.70.0)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opa" "$RUNNER_TEMP/opa"
          chmod +x "$RUNNER_TEMP/opa"
          echo "OPA_BINARY=$RUNNER_TEMP/opa" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Start services
        run: docker compose up --build -d postgres redis opa

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U acr -d acr_control_plane; do sleep 2; done'
          timeout 60 bash -c 'until docker compose exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done'
          timeout 60 bash -c 'until curl --fail --silent http://localhost:8181/health; do sleep 2; done'

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short --junitxml=integration-results.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acr-integration-test-report
          path: implementations/acr-control-plane/integration-results.xml
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis opa

      - name: Tear down services
        if: always()
        run: docker compose down -v --remove-orphans

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementations/acr-control-plane/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check dependencies for known CVEs
        run: |
          # The editable project is not released on PyPI. Audit every resolved
          # dependency instead; keep strict failures and do not waive CVEs.
          python -m pip freeze --exclude acr-control-plane > "$RUNNER_TEMP/acr-audit-requirements.txt"
          python -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/acr-audit-requirements.txt"

      - name: Upload audited dependency snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acr-audited-dependencies
          path: ${{ runner.temp }}/acr-audit-requirements.txt
          retention-days: 7

  opa:
    name: OPA policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Match the OPA version in docker-compose.yml without installing a binary
      # on the runner or using a production policy service.
      - name: Verify OPA policies parse cleanly
        run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:0.70.0 check /policies

      - name: Run OPA policy tests
        run: docker run --rm -v "$PWD/policies:/policies:ro" openpolicyagent/opa:0.70.0 test /policies -v

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: Dockerfile
          - service: killswitch
            dockerfile: Dockerfile.killswitch
          - service: protected-executor
            dockerfile: examples/protected_executor/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: implementations/acr-control-plane
          file: implementations/acr-control-plane/${{ matrix.dockerfile }}
          push: false
          load: true
          cache-from: type=gha,scope=acr-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=acr-${{ matrix.service }}
          tags: acr-${{ matrix.service }}:ci

      - name: Verify release image and installed wheel licenses
        if: matrix.service != 'protected-executor'
        run: python scripts/check_release_licenses.py --image acr-${{ matrix.service }}:ci

      - name: Verify protected executor starts as non-root
        if: matrix.service == 'protected-executor'
        run: |
          docker run --rm --entrypoint python acr-protected-executor:ci -c \
            "import os; assert os.getuid() != 0; from examples.protected_executor.app import app; assert app"
